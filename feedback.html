<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | Feedback</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/feedback.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Version 2.0 feedback workflow</p>
                        <h1 class="page-title">Feedback & Bug Reports</h1>
                        <p class="page-description">
                            Submit issues, filter feedback, update status, and promote ideas directly into the roadmap.
                        </p>
                    </div>
                </header>

                <section class="feedback-layout">
                    <form id="feedbackForm" class="glass-card feedback-form-card">
                        <h2 class="h5 mb-3">Submit Feedback</h2>

                        <div class="mb-3">
                            <label class="form-label" for="feedbackType">Type</label>
                            <select id="feedbackType" class="form-select" required>
                                <option value="bug">Bug</option>
                                <option value="idea">Idea</option>
                                <option value="improvement">Improvement</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="feedbackTitle">Title</label>
                            <input id="feedbackTitle" class="form-control" placeholder="Example: Add note templates"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="feedbackDescription">Description</label>
                            <textarea id="feedbackDescription" class="form-control" rows="7"
                                placeholder="Describe what happened or what should improve..." required></textarea>
                        </div>

                        <button class="btn-fn w-100" type="submit">Submit Feedback</button>
                    </form>

                    <section class="glass-card feedback-list-card">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-3 flex-wrap">
                            <div>
                                <h2 class="h5 mb-1">Submitted Items</h2>
                                <p class="mb-0 small" style="color: var(--fn-muted);">
                                    Manage open → in progress → resolved.
                                </p>
                            </div>
                        </div>

                        <div class="feedback-filters">
                            <select id="typeFilter" class="form-select">
                                <option value="">All types</option>
                                <option value="bug">Bug</option>
                                <option value="idea">Idea</option>
                                <option value="improvement">Improvement</option>
                            </select>

                            <select id="statusFilter" class="form-select">
                                <option value="">All statuses</option>
                                <option value="open">Open</option>
                                <option value="in-progress">In Progress</option>
                                <option value="resolved">Resolved</option>
                            </select>
                        </div>

                        <div id="feedbackList" class="feedback-list"></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/feedback.js"></script>
</body>

</html>
