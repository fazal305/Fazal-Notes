<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | Create & Organize Notes with Folders and Tags</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />
    <link rel="canonical" href="https://fazal305.github.io/Fazal-Notes/notes.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/Fazal-Notes/notes.html" />
    <meta property="og:title" content="Fazal Notes | Create & Organize Notes with Folders and Tags" />
    <meta property="og:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fazal Notes | Create & Organize Notes with Folders and Tags" />
    <meta name="twitter:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/notes.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Version 1.0 notes module</p>
                        <h1 class="page-title">Notes</h1>
                        <p class="page-description">
                            Create, edit, search, pin, tag, and organize your notes with folders.
                        </p>
                    </div>

                    <button id="newNoteBtn" class="btn-fn">New Note</button>
                </header>

                <section class="notes-layout">
                    <aside class="glass-card notes-panel">
                        <div class="notes-toolbar">
                            <input id="searchInput" class="form-control" type="search"
                                placeholder="Search title, content, or tags">

                            <div class="folder-row">
                                <select id="folderFilter" class="form-select"></select>
                                <button id="addFolderBtn" class="btn-ghost" type="button">Add Folder</button>
                            </div>

                            <select id="tagFilter" class="form-select"></select>
                        </div>

                        <div id="noteList" class="note-list"></div>
                    </aside>

                    <section class="glass-card note-editor-card">
                        <div id="editorMount"></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/notes.js"></script>
</body>

</html>
