<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | Public-Style Feature Roadmap</title>
    <meta name="description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />
    <link rel="canonical" href="https://fazal305.github.io/Fazal-Notes/roadmap.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/Fazal-Notes/roadmap.html" />
    <meta property="og:title" content="Fazal Notes | Public-Style Feature Roadmap" />
    <meta property="og:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fazal Notes | Public-Style Feature Roadmap" />
    <meta name="twitter:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/roadmap.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Version 2.0 roadmap loop</p>
                        <h1 class="page-title">Roadmap</h1>
                        <p class="page-description">
                            Submit feature requests, upvote ideas, and move items from Planned to In Progress to
                            Shipped.
                        </p>
                    </div>
                </header>

                <form id="featureForm" class="glass-card roadmap-form mb-3">
                    <div class="row g-3 align-items-end">
                        <div class="col-lg-4">
                            <label class="form-label" for="featureTitle">Feature title</label>
                            <input id="featureTitle" class="form-control" placeholder="Example: Daily note template"
                                required>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="featureDescription">Description</label>
                            <input id="featureDescription" class="form-control"
                                placeholder="Explain why this should exist..." required>
                        </div>

                        <div class="col-lg-2">
                            <button class="btn-fn w-100" type="submit">Submit</button>
                        </div>
                    </div>
                </form>

                <section id="roadmapBoard" class="roadmap-board"></section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/roadmap.js"></script>
</body>

</html>
