<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/analytics.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Real usage analytics</p>
                        <h1 class="page-title">Analytics</h1>
                        <p class="page-description">
                            Every number here is computed from notes, folders, tags, and real usage events stored in
                            localStorage.
                        </p>
                    </div>
                </header>

                <section id="coreStats" class="analytics-stats mb-3"></section>

                <section class="analytics-grid">
                    <article class="glass-card chart-card">
                        <h2 class="h5 mb-1">Notes Created Over Time</h2>
                        <p class="small mb-3" style="color: var(--fn-muted);">Computed from note_created events.</p>
                        <div class="chart-wrap">
                            <canvas id="usageChart"></canvas>
                        </div>
                    </article>

                    <article class="glass-card chart-card">
                        <h2 class="h5 mb-1">Daily Activity</h2>
                        <p class="small mb-3" style="color: var(--fn-muted);">Created and edited note events from the
                            last 30 days.</p>
                        <div class="chart-wrap">
                            <canvas id="activityChart"></canvas>
                        </div>
                    </article>
                </section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/analytics.js"></script>
</body>

</html>
