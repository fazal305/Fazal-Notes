<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | A Real Note-Taking App with Folders, Tags & Version History</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />
    <link rel="canonical" href="https://fazal305.github.io/Fazal-Notes/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/Fazal-Notes/" />
    <meta property="og:title" content="Fazal Notes | A Real Note-Taking App with Folders, Tags & Version History" />
    <meta property="og:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fazal Notes | A Real Note-Taking App with Folders, Tags & Version History" />
    <meta name="twitter:description" content="A real note-taking app with folders, tags, note linking, version history, a feedback/bug loop, a public-style roadmap, and real usage analytics — built and shipped across two documented versions." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Product dashboard</p>
                        <h1 class="page-title">Fazal Notes</h1>
                        <p class="page-description">
                            A real local-first notes product with notes, folders, feedback, changelog discipline, and
                            real usage analytics.
                        </p>
                    </div>

                    <span id="versionBadge" class="badge-soft version-pill"></span>
                </header>

                <section id="statsGrid" class="stats-grid mb-3"></section>

                <section class="dashboard-layout">
                    <div class="dashboard-grid">
                        <div class="glass-card section-card">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <h2 class="h5 mb-1">Recent Notes</h2>
                                    <p class="text-muted-custom mb-0">Latest writing activity from your workspace.</p>
                                </div>
                                <a href="notes.html" class="btn-ghost">Open Notes</a>
                            </div>
                            <div id="recentNotes"></div>
                        </div>

                        <div class="glass-card section-card">
                            <h2 class="h5 mb-3">Quick Actions</h2>
                            <div id="quickActions" class="quick-actions"></div>
                        </div>
                    </div>

                    <aside class="glass-card section-card">
                        <h2 class="h5 mb-3">Activity Log</h2>
                        <div id="activityLog"></div>
                    </aside>
                </section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
