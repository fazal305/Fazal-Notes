<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Notes | Changelog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/changelog.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <main class="app-main">
            <div class="page-container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Release discipline</p>
                        <h1 class="page-title">Changelog</h1>
                        <p class="page-description">
                            A real version timeline for the product lifecycle of Fazal Notes.
                        </p>
                    </div>
                </header>

                <section class="changelog-layout">
                    <form id="changelogForm" class="glass-card changelog-form-card">
                        <h2 class="h5 mb-3">Add Changelog Entry</h2>

                        <div class="mb-3">
                            <label class="form-label" for="versionInput">Version</label>
                            <input id="versionInput" class="form-control" placeholder="2.0.0" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="titleInput">Title</label>
                            <input id="titleInput" class="form-control" placeholder="Second release shipped" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="notesInput">Release Notes</label>
                            <textarea id="notesInput" class="form-control" rows="8" placeholder="One note per line"
                                required></textarea>
                        </div>

                        <button class="btn-fn w-100" type="submit">Add Entry</button>
                    </form>

                    <section class="glass-card changelog-timeline-card">
                        <h2 class="h5 mb-3">Version Timeline</h2>
                        <div id="changelogTimeline" class="timeline"></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/changelog.js"></script>
</body>

</html>
